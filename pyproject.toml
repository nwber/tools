[project]
name = "tools"
version = "0.1.0"
description = "Developer tools served from a Cloudflare Python Worker (tools.nbergeron.dev)"
readme = "README.md"
requires-python = ">=3.12"
# Keep runtime dependencies empty for Phase 0: pure stdlib keeps the Worker
# bundle small and cold start fast. Vendored third-party packages are managed
# by pywrangler (`uv run pywrangler sync`) from this file when they are added.
dependencies = []

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest>=8.0",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
