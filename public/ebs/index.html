<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS EBS Pricing</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        line-height: 1.6;
      }
      h1 {
        color: #333;
        border-bottom: 2px solid #e9ecef;
        padding-bottom: 10px;
      }
      h2 {
        color: #333;
        border-bottom: 1px solid #e9ecef;
        padding-bottom: 8px;
        margin-top: 40px;
      }
      .home {
        display: inline-block;
        margin: 0 0 4px -8px;
        padding: 8px;
        color: #52606d;
        line-height: 0;
      }
      .home:hover {
        color: #007bff;
      }
      .home svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
      }
      input,
      select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      button {
        background: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th {
        background: #f8f9fa;
        font-weight: 600;
        cursor: pointer;
      }
      th:hover {
        background: #e9ecef;
      }
      .error {
        color: #dc3545;
        font-weight: bold;
      }
      .warning {
        color: #856404;
        background: #fff3cd;
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
      }
      .graph-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: 16px 0 0;
        max-width: 420px;
      }
      .graph-controls select {
        flex: 1 1 160px;
      }
      .scale-toggle {
        display: inline-flex;
      }
      .scale-toggle button {
        background: white;
        color: #52606d;
        border: 1px solid #ddd;
        border-radius: 0;
        padding: 8px 14px;
      }
      .scale-toggle button:first-child {
        border-radius: 4px 0 0 4px;
      }
      .scale-toggle button:last-child {
        border-radius: 0 4px 4px 0;
      }
      .scale-toggle button + button {
        border-left: none;
      }
      .scale-toggle button:hover {
        background: #f8f9fa;
      }
      .scale-toggle button.active {
        background: #007bff;
        border-color: #007bff;
        color: white;
      }
      .scale-toggle button.active:hover {
        background: #0056b3;
      }
      #costChart {
        margin-top: 10px;
      }
      .chart-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin-top: 10px;
        font-size: 14px;
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .legend-item .swatch {
        width: 18px;
        height: 3px;
        border-radius: 2px;
      }
      .legend-item.legend-empty {
        color: #9aa5b1;
        cursor: help;
      }
      .chart-empty {
        color: #6d7f97;
        margin: 12px 0;
      }
      @media (max-width: 768px) {
        .form {
          grid-template-columns: 1fr;
        }
        /* Reflow the results table into cards so the page never scrolls
           horizontally on phones. Desktop layout is untouched. */
        #results,
        #results tbody,
        #results tr,
        #results td {
          display: block;
        }
        #results {
          font-size: 14px;
        }
        #results thead {
          display: none;
        }
        #results tr {
          border: 1px solid #e3e8ee;
          border-radius: 6px;
          padding: 10px 12px;
          margin-bottom: 10px;
        }
        #results td {
          border: none;
          padding: 3px 0;
        }
        #results td:first-child {
          font-weight: 600;
          padding-bottom: 6px;
        }
        #results td[data-label] {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          gap: 12px;
        }
        #results td[data-label]::before {
          content: attr(data-label);
          color: #6d7f97;
          font-size: 0.85rem;
        }
        #results td:last-child {
          border-top: 1px solid #eef2f7;
          margin-top: 6px;
          padding-top: 6px;
        }
      }
    </style>
    <script src="/analytics.js" defer></script>
  </head>
  <body>
    <a class="home" href="/" aria-label="Toolbox home" title="Toolbox home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" /></svg></a>
    <h1>AWS EBS Pricing</h1>
    <div class="form">
      <div>
        <label for="region">Region</label
        ><select id="region" onchange="calculate()">
          <option value="us-east-1">US East (N. Virginia)</option>
          <option value="us-west-2">US West (Oregon)</option>
          <option value="eu-west-1">EU (Ireland)</option>
        </select>
      </div>
      <div>
        <label for="size">Size</label
        ><input
          type="number"
          id="size"
          value="100"
          min="1"
          oninput="calculate()"
        /><select id="sizeUnit" onchange="calculate()">
          <option value="GB">GiB</option>
          <option value="TB">TiB</option>
        </select>
      </div>
      <div>
        <label for="iops">IOPS</label
        ><input
          type="number"
          id="iops"
          value="3000"
          min="0"
          oninput="calculate()"
        />
      </div>
      <div>
        <label for="throughput">Throughput (MiB/s)</label
        ><input
          type="number"
          id="throughput"
          value="125"
          min="0"
          oninput="calculate()"
        />
      </div>
      <div><button onclick="calculate()">Calculate</button></div>
    </div>
    <div>
      <label for="volumeTypes">Volume Types</label>
      <div style="position: relative">
        <input
          type="text"
          id="volumeTypesInput"
          readonly
          style="
            margin-top: 5px;
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            background: white;
          "
          value="gp3, io2"
        />
        <div
          id="volumeTypesDropdown"
          style="
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 4px 4px;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
          "
        ></div>
      </div>
    </div>
    <div id="warning" class="warning" style="display: none"></div>
    <table id="results">
      <thead>
        <tr>
          <th onclick="sortTable(0)">Type ↕</th>
          <th onclick="sortTable(1)">Durability ↕</th>
          <th onclick="sortTable(2)">Storage ↕</th>
          <th onclick="sortTable(3)">IOPS ↕</th>
          <th onclick="sortTable(4)">Throughput ↕</th>
          <th onclick="sortTable(5)">Total ↕</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <h2>Cost graph</h2>
    <div class="graph-controls">
      <select
        id="graphX"
        title="X axis"
        aria-label="X axis"
        onchange="calculate()"
      >
        <option value="iops" selected>IOPS</option>
        <option value="throughput">Throughput (MiB/s)</option>
        <option value="size">Size (GiB)</option>
      </select>
      <div class="scale-toggle" role="group" aria-label="Y axis scale">
        <button type="button" id="scaleLinear" class="active" aria-pressed="true">
          Linear
        </button>
        <button type="button" id="scaleLog" aria-pressed="false">Log</button>
      </div>
    </div>
    <div id="costChart"></div>
    <script type="module" src="/ebs/ebs-page.js"></script>
  </body>
</html>
