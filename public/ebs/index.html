<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS EBS Pricing</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        line-height: 1.6;
      }
      h1 {
        color: #333;
        border-bottom: 2px solid #e9ecef;
        padding-bottom: 10px;
      }
      .form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
      }
      input,
      select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      button {
        background: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th {
        background: #f8f9fa;
        font-weight: 600;
        cursor: pointer;
      }
      th:hover {
        background: #e9ecef;
      }
      .error {
        color: #dc3545;
        font-weight: bold;
      }
      .warning {
        color: #856404;
        background: #fff3cd;
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
      }
      @media (max-width: 768px) {
        .form {
          grid-template-columns: 1fr;
        }
        table {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <h1>AWS EBS Pricing</h1>
    <div class="form">
      <div>
        <label for="region">Region</label
        ><select id="region" onchange="calculate()">
          <option value="us-east-1">US East (N. Virginia)</option>
          <option value="us-west-2">US West (Oregon)</option>
          <option value="eu-west-1">EU (Ireland)</option>
        </select>
      </div>
      <div>
        <label for="size">Size</label
        ><input
          type="number"
          id="size"
          value="100"
          min="1"
          oninput="calculate()"
        /><select id="sizeUnit" onchange="calculate()">
          <option value="GB">GiB</option>
          <option value="TB">TiB</option>
        </select>
      </div>
      <div>
        <label for="iops">IOPS</label
        ><input
          type="number"
          id="iops"
          value="3000"
          min="0"
          oninput="calculate()"
        />
      </div>
      <div>
        <label for="throughput">Throughput (MiB/s)</label
        ><input
          type="number"
          id="throughput"
          value="125"
          min="0"
          oninput="calculate()"
        />
      </div>
      <div><button onclick="calculate()">Calculate</button></div>
    </div>
    <div>
      <label for="volumeTypes">Volume Types</label>
      <div style="position: relative">
        <input
          type="text"
          id="volumeTypesInput"
          readonly
          style="
            margin-top: 5px;
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            background: white;
          "
          value="gp3, io2"
        />
        <div
          id="volumeTypesDropdown"
          style="
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 4px 4px;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
          "
        ></div>
      </div>
    </div>
    <div id="warning" class="warning" style="display: none"></div>
    <table id="results">
      <thead>
        <tr>
          <th onclick="sortTable(0)">Type ↕</th>
          <th onclick="sortTable(1)">Durability ↕</th>
          <th onclick="sortTable(2)">Storage ↕</th>
          <th onclick="sortTable(3)">IOPS ↕</th>
          <th onclick="sortTable(4)">Throughput ↕</th>
          <th onclick="sortTable(5)">Total ↕</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <script type="module" src="/ebs/ebs-page.js"></script>
  </body>
</html>
