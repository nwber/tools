# Deploys the Worker to Cloudflare on every push to main, via Alchemy.
#
# Requires two repository secrets (Settings > Secrets and variables > Actions):
#
#   CLOUDFLARE_API_TOKEN — API token with:
#       Account > Workers Scripts > Edit       (upload the Worker + state store)
#       Account > Secrets Store > Edit         (alchemy state store bearer token)
#       Account > Account Settings > Read      (resolve the account)
#       Zone > Workers Routes > Edit           (attach the custom domains,
#                                               scoped to the nbergeron.dev zone)
#       Zone > DNS > Edit                      (DNS records for the custom domains)
#   CLOUDFLARE_ACCOUNT_ID — the account ID from the Cloudflare dashboard.
#
# Token: https://dash.cloudflare.com/profile/api-tokens

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate PostHog bootstrap
        run: node scripts/generate-analytics.mjs --require
        env:
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
      - name: Deploy (alchemy, stage prod)
        run: npx alchemy deploy --stage prod --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke tests
        run: |
          export EXPECT_VERSION="$(grep -oP 'WORKER_VERSION = "\K[^"]+' src/handler.ts)"
          echo "expecting worker version $EXPECT_VERSION"
          scripts/smoke.sh https://toolbox.nbergeron.dev
        env:
          IP_BASE: https://ip.nbergeron.dev
