name: ci

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Unit tests
        run: uv run pytest
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
