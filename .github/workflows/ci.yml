name: ci

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Guard the smoke script (it is not executed by unit tests)
        run: |
          bash -n scripts/smoke.sh
          grep -q "smoke checks passed" scripts/smoke.sh
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Preflight: verify the CLOUDFLARE_API_TOKEN/ACCOUNT_ID secrets are valid
  # and still carry the scopes the deploy needs — early warning for token
  # expiry or scope drift. Fork PRs skip via the guard below.
  verify-credentials:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe Cloudflare API scopes
        if: env.HAS_CF_TOKEN == 'true'
        run: |
          set -uo pipefail
          api() {
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"
          }
          echo "== token verify"
          api https://api.cloudflare.com/client/v4/user/tokens/verify \
            | jq -c '{success, status: .result.status, errors}'
          echo "== account read (Account Settings:Read)"
          api "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" \
            | jq -c '{success, name: .result.name, errors}'
          echo "== zone lookup nbergeron.dev (Zone:Read)"
          ZONE_JSON=$(api "https://api.cloudflare.com/client/v4/zones?name=nbergeron.dev")
          echo "$ZONE_JSON" | jq -c '{success, zones: [.result[]?.name], errors}'
          ZONE_ID=$(echo "$ZONE_JSON" | jq -r '.result[0].id // empty')
          echo "== workers scripts list (Workers Scripts)"
          api "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            | jq -c '{success, count: (.result | length), errors}'
          echo "== secrets store list (Secrets Store)"
          api "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/secrets_store/stores" \
            | jq -c '{success, count: (.result | length), errors}'
          if [ -n "$ZONE_ID" ]; then
            echo "== workers routes list (Workers Routes)"
            api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
              | jq -c '{success, count: (.result | length), errors}'
            echo "== dns records list (DNS)"
            api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=5" \
              | jq -c '{success, count: (.result | length), errors}'
          fi
      - name: No token secret
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN secret is not set; skipping probe."
